<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f4f2ee">
<meta name="description" content="This week's shopping list by store section, built from the meal plan and recipes. Check items off as you shop.">
<title>Shopping · Family kitchen</title>
<link rel="stylesheet" href="../kitchen/hearth.css">
<link rel="stylesheet" href="shopping.css">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script src="../kitchen/state.js" defer fetchpriority="high"></script>
<script src="list.js" defer></script>
<script src="app.js" defer fetchpriority="high"></script>
<link rel="apple-touch-icon" sizes="180x180" href="/kitchen/icons/apple-touch-icon.png">
<link rel="manifest" href="/kitchen/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Kitchen">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body class="page-shopping">
<a class="skip" href="#app">Skip to the list</a>
<header class="top">
  <div class="wrap top-row">
    <a class="brand" href="./"><small>Family kitchen</small><strong>Shopping</strong></a>
    <nav class="nav" aria-label="Kitchen">
      <ul>
        <li><a href="../planner/">Plan</a></li>
        <li><a href="../recipes/">Recipes</a></li>
        <li><a href="./" aria-current="page">Shopping</a></li>
      </ul>
    </nav>
  </div>
</header>
<main class="wrap" id="app" tabindex="-1">
  <p>Loading the list…</p>
</main>
<dialog id="gate" aria-labelledby="gateTitle">
  <form method="dialog">
    <h1 id="gateTitle"></h1>
    <p id="gateBody"></p>
    <div class="row">
      <button class="btn-quiet" value="cancel" type="submit" id="gateCancel">Cancel</button>
      <button class="btn-danger" value="ok" type="submit" id="gateOk">Continue</button>
    </div>
  </form>
</dialog>
<p class="sr" id="live" aria-live="polite"></p>
</body>
</html>
